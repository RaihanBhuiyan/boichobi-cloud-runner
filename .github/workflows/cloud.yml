name: cloud-assistant
on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "2-59/10 * * * *"
  workflow_dispatch:
    inputs:
      simulate:
        description: "পরীক্ষা: কিছু বদলায় না, শুধু Telegram-এ দেখায়"
        type: boolean
        default: false
      test_state:
        description: "পরীক্ষা-ঘর (আসল স্টেট নয়): পুরো পিসি-অফ পথ"
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
concurrency:
  group: cloud-assistant
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      TZ: Asia/Dhaka
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      HF_WRITE_TOKEN: ${{ secrets.HF_WRITE_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SIMULATE: ${{ inputs.simulate && '1' || '0' }}
      CLOUD_TEST: ${{ inputs.test_state && '1' || '0' }}
      CLOUD_STATE_REPO: ${{ inputs.test_state && 'raihanaal2/boichobi-cloud-state-test' || 'raihanaal2/boichobi-cloud-state' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q "huggingface_hub>=0.26" requests
      - id: gate
        run: python gate.py
      - if: steps.gate.outputs.run == '1'
        uses: actions/checkout@v4
        with:
          repository: RaihanBhuiyan/boier-golpo
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          path: proj
          fetch-depth: 1
      - if: steps.gate.outputs.run == '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core >/dev/null
          pip install -q "kaggle>=1.8" six requests pillow numpy
          npm i -g @google/gemini-cli >/dev/null 2>&1 || echo "gemini-cli ইনস্টল ব্যর্থ — টেক্সট-Gemini পথে চলবে"
          npm i -g @anthropic-ai/claude-code >/dev/null 2>&1 || echo "claude-code ইনস্টল ব্যর্থ — Gemini পথে চলবে"
      - if: steps.gate.outputs.run == '1'
        working-directory: proj
        run: python scripts/cloud_tick.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
      - name: পরের রান ডাকা (চেইন; সময়সূচি না চললেও সহকারী জেগে থাকে, একসাথে একটাই)
        if: always() && inputs.simulate != true && inputs.test_state != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep $([ "${{ steps.gate.outputs.run }}" = "1" ] && echo 30 || echo 240)
          n=$(gh run list -R "$GITHUB_REPOSITORY" -w cloud.yml --limit 20 --json status -q '[.[]|select(.status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested")]|length')
          echo "অপেক্ষমাণ রান: $n"
          [ "$n" = "0" ] && gh workflow run cloud.yml -R "$GITHUB_REPOSITORY" || true
